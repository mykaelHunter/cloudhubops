apiVersion: apps/v1
kind: Deployment
metadata:
  name: payday-frontend
  namespace: prod
  labels:
    app: payday-frontend
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payday-frontend
  template:
    metadata:
      labels:
        app: payday-frontend
        environment: prod
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: payday-frontend
          image: rapiddeploy.azurecr.io/rapiddeploy/payday-frontend:prod
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
---
# LoadBalancer gives a public Azure IP for prod
apiVersion: v1
kind: Service
metadata:
  name: payday-frontend
  namespace: prod
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /
spec:
  selector:
    app: payday-frontend
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payday-frontend-pdb
  namespace: prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: payday-frontend
