apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: prod
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_THIS_IN_VAULT"
  DB_PASS: "CHANGE_THIS_IN_VAULT"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: prod
data:
  FLASK_ENV: "production"
  FLASK_DEBUG: "false"
  DB_HOST: "payday-postgres"
  DB_PORT: "5432"
  DB_NAME: "payday"
  DB_USER: "postgres"
  DB_SSLMODE: "disable"
  PORT: "5000"
  WORKERS: "4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payday-backend
  namespace: prod
  labels:
    app: payday-backend
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payday-backend
  template:
    metadata:
      labels:
        app: payday-backend
        environment: prod
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: payday-backend
          image: rapiddeploy.azurecr.io/rapiddeploy/payday-backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASS
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: payday-backend
  namespace: prod
spec:
  selector:
    app: payday-backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payday-backend-pdb
  namespace: prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: payday-backend
