apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: rapiddeploy.azurecr.io/rapiddeploy/payday-api:latest
          ports:
            - containerPort: 5000
          env:
            - name: ENVIRONMENT
              value: "dev"
