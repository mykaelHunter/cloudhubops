apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: dev
type: Opaque
stringData:
  SECRET_KEY: "dev-secret-change-in-prod"
  DB_PASS: "devpassword"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: dev
data:
  FLASK_ENV: "production"
  FLASK_DEBUG: "false"
  DB_HOST: "payday-postgres"
  DB_PORT: "5432"
  DB_NAME: "payday"
  DB_USER: "postgres"
  DB_SSLMODE: "disable"
  ALLOWED_ORIGINS: "http://localhost:8080,http://payday-frontend.dev.svc.cluster.local"
  PORT: "5000"
  WORKERS: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payday-api
  namespace: dev
  labels:
    app: payday-api
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payday-api
  template:
    metadata:
      labels:
        app: payday-api
        environment: dev
    spec:
      containers:
        - name: payday-api
          image: rapiddeploy.azurecr.io/rapiddeploy/payday-api:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASS
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: payday-api
  namespace: dev
spec:
  selector:
    app: payday-api
  ports:
    - port: 5000
      targetPort: 5000
