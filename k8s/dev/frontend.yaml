apiVersion: apps/v1
kind: Deployment
metadata:
  name: payday-frontend
  namespace: dev
  labels:
    app: payday-frontend
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payday-frontend
  template:
    metadata:
      labels:
        app: payday-frontend
        environment: dev
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: payday-frontend
          image: rapiddeploy.azurecr.io/rapiddeploy/payday-frontend:77099bd
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: payday-frontend
  namespace: dev
spec:
  selector:
    app: payday-frontend
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
