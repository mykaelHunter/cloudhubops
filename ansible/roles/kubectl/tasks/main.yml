---
# ============================================================
# Role: kubectl — Install kubectl
# ============================================================

- name: Get latest stable kubectl version
  uri:
    url: https://dl.k8s.io/release/stable.txt
    return_content: yes
  register: kubectl_stable_version
  when: kubectl_version == "stable"

- name: Set kubectl version fact
  set_fact:
    kubectl_install_version: "{{ kubectl_stable_version.content | trim }}"
  when: kubectl_version == "stable"

- name: Download kubectl
  get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_install_version }}/bin/linux/amd64/kubectl"
    dest: /tmp/kubectl
    mode: '0755'

- name: Install kubectl
  copy:
    src: /tmp/kubectl
    dest: /usr/local/bin/kubectl
    mode: '0755'
    remote_src: yes
  become: yes

- name: Verify kubectl installation
  command: kubectl version --client
  register: kubectl_version_output
  changed_when: false

- name: Print kubectl version
  debug:
    msg: "{{ kubectl_version_output.stdout }}"

- name: Install bash completion for kubectl
  shell: kubectl completion bash > /etc/bash_completion.d/kubectl
  become: yes
  changed_when: false

- name: Add kubectl alias to bashrc
  lineinfile:
    path: "/home/{{ ansible_user }}/.bashrc"
    line: "alias k=kubectl"
    state: present
